# Builds the rolling `latest` release; `make publish` uploads it.
version: 2
project_name: myskills

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # The version comes from the go build stamp (the commit's pseudo-version).
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Fixed names, so releases/latest/download/<name> links keep working.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  disable: true
